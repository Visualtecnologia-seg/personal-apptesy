# Perfil usado na hospedagem (Render). Banco vem das variáveis de ambiente.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Cada pedido pode usar até 2 conexões (JPA + consultas diretas): o banco precisa ter mais que o dobro das linhas de atendimento,
# senão poucos pedidos ao mesmo tempo esgotam as conexões e o servidor trava 30 s para todo mundo.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=9
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=300
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

pagarme.key=${PAGARME_KEY:}
pagarme.url=https://api.pagar.me/core/v5
pagarme.customers-endpoint=/customers
pagarme.customers-cards-endpoint=/customers/%s/cards
pagarme.orders-endpoint=/orders
pagarme.charges-capture-endpoint=/charges/%s/capture
pagarme.charges-refund-endpoint=/charges/%s

server.tomcat.relaxed-query-chars= [,]
