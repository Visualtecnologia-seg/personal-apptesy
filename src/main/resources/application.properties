#Profile active
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Porta do servidor (pode ser sobrescrita por variável de ambiente)
server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
########
# mail #
########
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#######
# LOGS #
#######
logging.file.name=logs/personalfighters.log
logging.logback.rollingpolicy.clean-history-on-start=false
#######
# AWS #
#######
aws.access_key_id=${AWS_ACCESS_KEY_ID:nao-configurado}
aws.secret_access_key=${AWS_SECRET_ACCESS_KEY:nao-configurado}
s3.bucket=personalfighters
s3.region=us-east-2

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=-1

#Utilizado para retornar a paginação. Sem essa config retorna vazio.
spring.jackson.mapper.DEFAULT_VIEW_INCLUSION=true

create.fake.data=false
create.fake.data.limit=10

# Data Base Migration
spring.flyway.enabled=true

# Asaas Payment Gateway
asaas.api.key=${ASAAS_API_KEY:CHAVE_NAO_CONFIGURADA}
asaas.api.url=https://api.asaas.com/api/v3
# Token de validação do webhook Asaas (preencher com o token gerado no painel Asaas)
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN:}

