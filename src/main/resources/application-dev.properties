# Postgres
spring.datasource.url=jdbc:postgresql://helium:5432/heliumdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect
# Show or not log for each sql query
spring.jpa.show-sql=false
# Hibernate ddl auto (create, create-drop, update)
spring.jpa.hibernate.ddl-auto=none

pagarme.key=${PAGARME_KEY:}
pagarme.url=https://api.pagar.me/core/v5
pagarme.customers-endpoint=/customers
pagarme.customers-cards-endpoint=/customers/%s/cards
pagarme.orders-endpoint=/orders
pagarme.charges-capture-endpoint=/charges/%s/capture
pagarme.charges-refund-endpoint=/charges/%s

server.port=8080
server.tomcat.relaxed-query-chars= [,]