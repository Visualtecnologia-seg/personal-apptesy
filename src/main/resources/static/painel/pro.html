<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profissional OPUS</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F3F5F9;color:#0B1530}
.top{background:linear-gradient(135deg,#0B1F4D,#1D4ED8 60%,#0891B2);height:150px}
.card{max-width:420px;margin:-90px auto 30px;background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 14px 34px rgba(11,31,77,.15)}
.av{width:110px;height:110px;border-radius:30px;object-fit:cover;background:#DBEAFE;border:4px solid #fff;margin-top:-80px}
h1{margin:12px 0 4px;font-size:24px}.muted{color:#5B6474;font-size:14px}
.row{display:flex;gap:10px;justify-content:center;margin:16px 0}.pill{background:#EEF4FF;color:#1E3A8A;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.btn{display:block;margin-top:18px;height:54px;line-height:54px;border-radius:16px;background:#047857;color:#fff;text-decoration:none;font-weight:800}
.seal{display:inline-block;margin:4px;background:#FEF3C7;color:#92400E;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700}
</style></head><body>
<div class="top"></div>
<div class="card" id="c"><p class="muted">Carregando…</p></div>
<script>
const id=new URLSearchParams(location.search).get('id');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/public/pro/'+encodeURIComponent(id)).then(r=>r.ok?r.json():Promise.reject()).then(p=>{
  const s=p.seals||{};
  document.getElementById('c').innerHTML=`<img class="av" src="${p.avatar?esc(p.avatar):'/users/'+p.id+'/avatar'}" alt="" onerror="this.style.visibility='hidden'">
  <h1>${esc(p.name)}</h1><div class="muted">Profissional verificado no OPUS</div>
  <div class="row"><span class="pill">★ ${p.rating??'novo'}</span><span class="pill">${p.done} serviços</span><span class="pill">Nível ${esc(s.level||'Bronze')}</span></div>
  ${(s.certificates||[]).map(c=>`<span class="seal">✔ ${esc(c.title)}</span>`).join('')}
  <a class="btn" href="https://opus-backend-o8kw.onrender.com/">Contratar pelo app OPUS</a>
  <p class="muted" style="margin-top:12px">Pagamento protegido: o dinheiro fica no cofre OPUS até você aprovar o serviço.</p>`;
}).catch(()=>{document.getElementById('c').innerHTML='<p class="muted">Profissional não encontrado.</p>';});
</script></body></html>
