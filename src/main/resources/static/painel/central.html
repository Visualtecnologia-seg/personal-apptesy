<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPUS · Suporte e disputas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{--navy:#0B1F4D;--blue:#1D4ED8;--cyan:#0891B2;--bg:#F3F5F9;--card:#fff;--text:#0B1530;--muted:#6B7280;--line:#E5E7EB;--ok:#047857;--okbg:#D1FAE5;--bad:#B91C1C;--badbg:#FEE2E2;--warn:#92400E;--warnbg:#FEF3C7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Inter,sans-serif;color:var(--text)}
  h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;margin:0}
  header{background:linear-gradient(135deg,#0B1F4D 0%,#1D4ED8 55%,#0891B2 100%);color:#fff;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{font-size:20px}
  main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 6px 16px rgba(11,31,77,.06);padding:18px}
  button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 16px;font-weight:600}
  .primary{background:var(--navy);color:#fff}
  .ok{background:var(--ok);color:#fff}
  .danger{background:var(--bad);color:#fff}
  .ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
  .link{background:none;color:var(--blue);padding:0}
  input,textarea,select{font:inherit;width:100%;padding:11px 12px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;color:var(--text)}
  label{font-size:13px;font-weight:600;color:#334155;display:block;margin-bottom:6px}
  .login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{background:#fff;color:var(--text);border:1px solid var(--line)}
  .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .wrap{overflow-x:auto}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .PENDING{background:var(--warnbg);color:var(--warn)} .APPROVED{background:var(--okbg);color:var(--ok)} .REJECTED{background:var(--badbg);color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
  figure{margin:0;background:#F8FAFC;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  figure img{width:100%;height:260px;object-fit:contain;background:#0F172A;display:block;cursor:zoom-in}
  figcaption{padding:10px 12px;font-size:13px;font-weight:600}
  figcaption small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
  .gesture{border:2px solid var(--blue)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:13px}
  .info{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
  .info div{background:#F8FAFC;border-radius:10px;padding:10px 12px;font-size:13px}
  .info b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px}
  .checks{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
  .checks label{display:flex;gap:6px;align-items:center;font-weight:500;margin:0}
  .checks input{width:auto}
  .msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
  .zoom{position:fixed;inset:0;background:rgba(2,6,23,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .zoom img{max-width:100%;max-height:100%;object-fit:contain}
  .hidden{display:none !important}
  .emb header{display:none!important}.emb body{background:transparent}
</style>
<style>
  .cols{display:grid;grid-template-columns:320px 1fr;gap:14px}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
  .item{padding:12px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line);cursor:pointer}
  .item.on{border-color:var(--navy);background:#EEF2FF}
  .item b{display:block;font-size:14px}
  .item small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin:2px 0}
  .tag.red{background:#FEE2E2;color:#B91C1C}.tag.amb{background:#FEF3C7;color:#92400E}.tag.opi{background:#E0F2FE;color:#075985}
  .item.prio{border-color:#DC2626;background:#FEF2F2}
  .bub.opi{background:#E0F2FE!important;color:#0C4A6E!important}
  .bub .btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.bub .btns span{font-size:11px;border:1px solid currentColor;border-radius:999px;padding:1px 8px;opacity:.8}
  .badge{float:right;background:var(--bad);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
  .chat{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto;padding:6px 2px;margin:10px 0}
  .bub{max-width:78%;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .bub small{display:block;font-size:11px;opacity:.7;margin-top:4px}
  .me{align-self:flex-end;background:var(--navy);color:#fff}
  .them{align-self:flex-start;background:#F1F5F9}
  .sys{align-self:center;background:#FEF3C7;color:#92400E;font-size:12px}
  .bub img{max-width:240px;border-radius:10px;display:block;margin-top:6px;cursor:zoom-in}
  h3{font-size:15px;margin:18px 0 8px}
  .ph{display:flex;gap:8px;flex-wrap:wrap}
  .ph img{width:130px;height:130px;object-fit:cover;border-radius:10px;cursor:zoom-in}
  .OPEN{background:var(--warnbg);color:var(--warn)} .RESOLVED_PRO,.RESOLVED_CLIENT{background:var(--okbg);color:var(--ok)}
</style>
</head>
<body>
<script>/* embed-hide */ if (window.top !== window.self) document.documentElement.classList.add("emb"); else location.replace("/painel/admin.html#suporte");</script>
<header>
  <h1>OPUS · Suporte e disputas</h1>
  <div class="row"><a href="/painel/" style="color:#fff;font-weight:700;text-decoration:none;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3)">← Verificações</a></div>
</header>
<main>
  <div id="needLogin" class="card hidden">Entre primeiro pela página <a href="/painel/">Verificações</a> com a conta de administrador.</div>
  <div id="app" class="hidden">
    <div class="tabs">
      <button class="tab on" data-t="sup">Suporte</button>
      <button class="tab" data-t="dis">Disputas abertas</button>
      <button class="tab" data-t="all">Todas as disputas</button>
    </div>
    <div class="cols">
      <div class="card"><div id="list" class="list"></div></div>
      <div class="card" id="detail"><p class="muted">Escolha uma conversa ou disputa ao lado.</p></div>
    </div>
  </div>
</main>
<div class="zoom" id="zoom"><img id="zoomImg" alt="Foto ampliada"></div>
<script>
/* O código do painel só é entregue para quem entrou com login, senha e código. */
(function(){ var t=null; try{ t=sessionStorage.getItem('opus_admin_token'); }catch(e){}
  if(!t){ location.replace('/painel/admin.html'); return; }
  fetch('/admin/ui/central.js',{headers:{Authorization:'Bearer '+t},cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(c){ var s=document.createElement('script'); s.text=c; document.body.appendChild(s); })
    .catch(function(){ try{ sessionStorage.removeItem('opus_admin_token'); }catch(e){} location.replace('/painel/admin.html'); });
})();
</script>
</body>
</html>
